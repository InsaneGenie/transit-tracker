<!doctype html>
<!-- The link preview picture, web/public/og-image.png (1200x630). To change it, edit this page and screenshot it at 1200x630 with Playwright: page.setViewportSize, page.goto, page.screenshot. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#0b1220;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;position:relative}
svg.map{position:absolute;inset:0}
.text{position:absolute;left:72px;top:190px;width:600px;color:#f8fafc}
.brand{display:flex;align-items:center;gap:20px;margin-bottom:28px}
.brand svg{width:84px;height:84px;flex:none}
h1{white-space:nowrap;font-size:66px;line-height:1;margin:0;font-weight:800;letter-spacing:-1.5px}
p{font-size:32px;line-height:1.3;margin:0 0 30px;color:#cbd5e1;font-weight:500}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{font-size:22px;font-weight:700;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.08);color:#e2e8f0;display:flex;align-items:center;gap:10px}
.chip i{width:14px;height:14px;display:inline-block}
.live{position:absolute;left:72px;top:72px;display:flex;align-items:center;gap:10px;color:#4ade80;font-size:22px;font-weight:800;letter-spacing:2px}
.live i{width:14px;height:14px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 6px rgba(34,197,94,.25)}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#0b1220 0%,#0b1220 46%,rgba(11,18,32,.6) 60%,rgba(11,18,32,0) 75%)}
</style></head><body>
